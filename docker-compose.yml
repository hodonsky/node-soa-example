  elixir-gateway:
    build:
      context: /home/ubuntu/resources/elixir
    ports:
     - "80:80"
    environment:
    - GATEWAY_ENV=local
    - HOSTNAME=gateway
    - PORT=80
    - MQ_PROTOCOL=amqp
    - MQ_HOSTNAME=rabbitmq
    - MQ_PORT=5672
    - MQ_USERNAME=admin
    - MQ_PASSWORD=Abcd1234
    - MQ_QUEUE=gateway
    depends_on:
     - rabbitmq
    restart: on-failure
    volumes:
      - /home/ubuntu/resources/elixir/gateway/lib:/usr/src/app/lib/
  
